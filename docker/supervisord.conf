; Two processes in the CCXPBX container. Both are restarted when they exit - Asterisk exits on
; purpose when the web UI asks for "core restart" (e.g. after a SIP transport change).
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:asterisk]
; runs as root only until it drops to runuser/rungroup from asterisk.conf
command=/usr/sbin/asterisk -f -C /etc/asterisk/asterisk.conf
priority=10
autorestart=true
startsecs=5
startretries=1000
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ccxpbx]
command=/opt/ccxpbx/venv/bin/python -m uvicorn ccxpbx.main:app --host 0.0.0.0 --port %(ENV_CCXPBX_HTTP_PORT)s --no-server-header --proxy-headers --forwarded-allow-ips 127.0.0.1
directory=/opt/ccxpbx/manager
user=ccxpbx
umask=027
priority=20
autorestart=true
startsecs=3
startretries=1000
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
