# CCXPBX on TrueNAS SCALE with its own LAN address (macvlan)
#
# The PBX gets a separate IP (here 192.168.10.120), so the web UI and provisioning stay on port 80
# and nothing collides with TrueNAS. Note: with macvlan the TrueNAS host itself cannot reach this
# address (the phones and other PCs can).
#
# Change before installing:
#   parent    -> the TrueNAS network interface (Network page, e.g. enp3s0 or br0)
#   subnet / gateway / ipv4_address / CCXPBX_HOST -> your LAN; pick a free address outside the DHCP pool
#   /mnt/tank/apps/ccxpbx -> a dataset you created for CCXPBX
services:
  ccxpbx:
    image: ghcr.io/adamz11/pbx-server-for-poly-ccx500:latest
    container_name: ccxpbx
    restart: unless-stopped
    networks:
      lan:
        ipv4_address: 192.168.10.120
    environment:
      CCXPBX_HOST: "192.168.10.120"
      CCXPBX_HTTP_PORT: "80"
      TZ: "Europe/Budapest"
    volumes:
      - /mnt/tank/apps/ccxpbx:/data
    stop_grace_period: 20s

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: enp3s0
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
