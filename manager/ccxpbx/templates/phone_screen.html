{% extends "base.html" %}
{% block title %}Főképernyő · {{ phone.label or phone.mac }} · CCXPBX{% endblock %}
{% block content %}
<form method="post" action="/phones/{{ phone.mac }}/screen" id="screen-form">
<div class="page-head">
  <div>
    <h1>Főképernyő</h1>
    <p class="muted">{{ phone.label or 'Telefon' }} <span class="mono">{{ phone.mac }}</span> · szerkeszd közvetlenül a kijelzőn</p>
  </div>
  <div class="row wrap">
    <span class="muted small" id="dirty" hidden>Nem mentett változások</span>
    <a class="btn secondary" href="/phones/{{ phone.mac }}">Vissza</a>
    <button>Mentés és küldés a telefonra</button>
  </div>
</div>

<div class="ccx-stage">
  <div class="ccx-col">
    <div class="ccx-mode" role="tablist" aria-label="Nézet">
      <button type="button" role="tab" data-mode="edit" class="on">Szerkesztés</button>
      <button type="button" role="tab" data-mode="view">Így fog kinézni</button>
    </div>

    <div class="ccx-device" aria-label="Poly CCX500">
      <div class="ccx-handset"><div class="ccx-handset-top"></div><span class="ccx-hd">HD Voice</span><div class="ccx-cord"></div></div>
      <div class="ccx-face">
        <div class="ccx-bezel">
          <div class="ccx-screen" id="pv-screen">
            <div class="ccx-top"><span class="ccx-menu" aria-hidden="true"><i></i><i></i><i></i></span><span id="pv-status"></span><span></span></div>
            <div class="ccx-clock"><div id="pv-time"></div><div id="pv-date"></div></div>
            <div class="ccx-apps" id="pv-apps"></div>
            <div class="ccx-dots" id="pv-app-dots"></div>
            <div class="ccx-dock" id="pv-dock"></div>
            <div class="ccx-dots small" id="pv-dock-dots"></div>
            <div class="ccx-nav"><span>&#8592;</span><span class="ccx-home"></span></div>
          </div>
        </div>
        <div class="ccx-speaker"></div>
        <div class="ccx-foot"><span class="ccx-brand"></span><span class="ccx-mute" title="Némítás"></span></div>
      </div>
    </div>
    <p class="muted small center" id="pv-note"></p>
  </div>

  <aside class="card ccx-inspector" id="inspector" aria-live="polite"></aside>
</div>
<div id="hidden-fields"></div>
</form>

<script type="application/json" id="editor-data">{{ editor|tojson }}</script>
<script type="application/json" id="key-types">{{ key_types|tojson }}</script>
<script src="/static/screen.js" defer></script>
{% endblock %}
