{#- The Poly CCX500 drawn after the product photo; proportions measured from it (phone 445 x 590 px).
    Use: {% from "_ccx.html" import device %}{% call device("screen-id") %} ...screen content... {% endcall %} -#}
{% macro device(screen_id) -%}
<div class="ccx-device" aria-label="Poly CCX500">
  <div class="ccx-base"></div>
  <div class="ccx-panel">
    <div class="ccx-glass">
      <div class="ccx-screen" id="{{ screen_id }}">{{ caller() }}</div>
      <div class="ccx-hwkeys" aria-hidden="true">
        <span class="hk"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
        <span class="hk"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none"/></svg></span>
        <span class="hk"><svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" fill="none"/></svg></span>
        <span class="hk"><svg viewBox="0 0 24 24"><path d="M5 14v-2a7 7 0 0 1 14 0v2M5 13h3v6H6a1 1 0 0 1-1-1zm14 0h-3v6h2a1 1 0 0 0 1-1z" stroke="currentColor" stroke-width="2" fill="none"/></svg></span>
        <span class="hk"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="2" fill="none"/></svg></span>
      </div>
    </div>
    <div class="ccx-grille"></div>
    <div class="ccx-strip"><span class="ccx-logo"></span>
      <svg class="ccx-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0zM6 11a6 6 0 0 0 12 0M12 17v3M4 4l16 16" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></div>
  </div>
  <div class="ccx-handset"><span class="ccx-hd">HD voice</span></div>
  <svg class="ccx-cord" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M78 0 C80 55 5 40 12 100" stroke="#0b0c0e" stroke-width="7" fill="none"/>
    {%- for i in range(34) %}{% set t = i / 33 %}{% set m = 1 - t %}
    <ellipse cx="{{ '%.1f' % (m*m*m*78 + 3*m*m*t*80 + 3*m*t*t*5 + t*t*t*12) }}" cy="{{ '%.1f' % (3*m*m*t*55 + 3*m*t*t*40 + t*t*t*100) }}"
             rx="6.5" ry="2.4" fill="none" stroke="#3a3f45" stroke-width="1.6"/>
    {%- endfor %}
  </svg>
</div>
{%- endmacro %}
