# Example dnsmasq snippet (/etc/dnsmasq.d/ccxpbx.conf) for zero-touch provisioning
# of the Poly CCX500. Replace the URL with the PROV_URL printed by the installer.
#
# Poly checks DHCP option 160 first, then option 66.
dhcp-option-force=160,"http://ccxprov:PASSWORD@192.168.1.10/prov"
dhcp-option-force=66,"http://ccxprov:PASSWORD@192.168.1.10/prov"
# NTP for the phones (optional, otherwise the configured NTP server is used)
# dhcp-option=42,192.168.1.10
