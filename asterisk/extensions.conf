; ccxpbx dialplan - static part. Per-extension/ring group/route entries are generated
; into ccxpbx/extensions_generated.conf by the manager.
;
; Numbering plan
;   2000-5999   extensions (recommended)          6xxx      ring groups
;   700         park (blind transfer / Park key)  701-708   parked calls (BLF)
;   800-809     conference rooms                  1xx       emergency (via outbound routes)
;   *97 own voicemail   *98 any voicemail   *43 echo test   *60 time
;   *80<ext> intercom   *82 page all        *88 group pickup   **<ext> directed pickup
;   In call: #72 park, *1 start/stop recording, ## blind transfer, *2 attended transfer

[general]
static=yes
writeprotect=yes
clearglobalvars=yes

[globals]
#include ccxpbx/globals.conf

[from-internal]
include => ccx-extensions
include => ccx-ringgroups
include => ccx-features
include => ccx-park-hint
include => parkedcalls
include => ccx-outbound

[from-trunk]
include => ccx-inbound

[ccx-features]
exten => *97,1,Answer()
 same => n,Wait(0.5)
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

exten => *98,1,Answer()
 same => n,Wait(0.5)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

exten => *43,1,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

exten => *60,1,Answer()
 same => n,Wait(0.5)
 same => n,SayUnixTime(,${TZ_NAME},HM)
 same => n,Hangup()

; Group pickup (same named_pickup_group)
exten => *88,1,Pickup()
 same => n,Hangup()

; Directed pickup: **2001 (Poly BLF key while ringing uses this)
exten => _**X.,1,Pickup(${EXTEN:2}@PICKUPMARK)
 same => n,Hangup()

; Intercom: *802001 -> callee auto-answers
exten => _*80X.,1,Gosub(sub-intercom,s,1(${EXTEN:3}))
 same => n,Hangup()

; Page all phones (unicast, auto-answer, one-way)
exten => *82,1,GotoIf($["${PAGE_ALL}"=""]?empty)
 same => n,Page(${PAGE_ALL},isb(sub-autoanswer-hdr^s^1),30)
 same => n,Hangup()
 same => n(empty),Playback(ss-noservice)
 same => n,Hangup()

; Conference rooms
exten => _80X,1,Answer()
 same => n,ConfBridge(${EXTEN})
 same => n,Hangup()

; Hint for the Poly "automata" park key on 700 so its subscription succeeds
[ccx-park-hint]
exten => 700,hint,Custom:ccx-park

; ARG1=ext ARG2=ring time ARG3=voicemail(0/1) ARG4=record(0/1)
[sub-dial-ext]
exten => s,1,Set(__PICKUPMARK=${ARG1})
 same => n,Set(__FORWARD_CONTEXT=from-internal)
 same => n,ExecIf($["${ARG4}"="1"]?MixMonitor(${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${ARG1}.wav,b))
 same => n,Set(DST=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($["${DST}"=""]?unavail)
 same => n,Dial(${DST},${ARG2},tTkKxX)
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy)
 same => n(unavail),GotoIf($["${ARG3}"="1"]?vmu)
 same => n,Playback(vm-nobodyavail)
 same => n,Return()
 same => n(vmu),VoiceMail(${ARG1}@default,u)
 same => n,Return()
 same => n(busy),GotoIf($["${ARG3}"="1"]?vmb)
 same => n,Busy(10)
 same => n,Return()
 same => n(vmb),VoiceMail(${ARG1}@default,b)
 same => n,Return()
 same => n(done),Return()

; Ring group member leg (no voicemail, so the group failover works)
[ccx-ringtarget]
exten => _X.,1,Set(DST=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($["${DST}"=""]?none)
 same => n,Dial(${DST},,tTkKxX)
 same => n,Hangup()
 same => n(none),Hangup(20)

; ARG1=ext
[sub-intercom]
exten => s,1,Set(DST=${PJSIP_DIAL_CONTACTS(${ARG1})})
 same => n,GotoIf($["${DST}"=""]?end)
 same => n,Dial(${DST},20,b(sub-autoanswer-hdr^s^1))
 same => n(end),Return()

; Pre-dial handler on the callee channel: Poly maps this Alert-Info to the autoAnswer ring class
[sub-autoanswer-hdr]
exten => s,1,Set(PJSIP_HEADER(add,Alert-Info)=${INTERCOM_ALERT})
 same => n,Return()

; ARG1=trunk ARG2=number ARG3=caller id number (optional)
[sub-outbound]
exten => s,1,ExecIf($["${ARG3}"!=""]?Set(CALLERID(num)=${ARG3}))
 same => n,Dial(PJSIP/${ARG2}@${ARG1},,tTkKxX)
 same => n,Return()

#include ccxpbx/extensions_generated.conf
