; ccxpbx PJSIP configuration. Transports, endpoints and trunks are generated
; by the manager into /etc/asterisk/ccxpbx/.

[global]
type=global
user_agent=ccxpbx
endpoint_identifier_order=ip,username,anonymous
max_initial_qualify_time=10
keep_alive_interval=90

[system]
type=system
timer_t1=500
timer_b=32000

#include ccxpbx/pjsip_transports.conf
#include ccxpbx/pjsip_endpoints.conf
#include ccxpbx/pjsip_trunks.conf
